name: Build & Push Docker

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'   # tiap hari jam 06:00 UTC, cek versi WildRig Multi terbaru
  workflow_dispatch: {}   # bisa dipicu manual dari tab Actions kalau mau cek sekarang

permissions:
  contents: write   # perlu buat commit balik file .wildrig_version

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cek versi WildRig Multi terbaru
        id: wildrig
        run: |
          LATEST=$(curl -s https://api.github.com/repos/andru-kun/wildrig-multi/releases/latest | jq -r '.tag_name')
          echo "Versi terbaru di GitHub : $LATEST"
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"

          OLD="none"
          if [ -f .wildrig_version ]; then
            OLD=$(cat .wildrig_version)
          fi
          echo "Versi tercatat terakhir : $OLD"

          if [ "$OLD" = "$LATEST" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Tidak ada versi baru, build di-skip."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        if: steps.wildrig.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push
        if: steps.wildrig.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            WILDRIG_VERSION=${{ steps.wildrig.outputs.version }}
            CACHEBUST=${{ github.run_id }}
          tags: |
            GANTI_USERNAME_DOCKERHUB/prlwr:latest
            GANTI_USERNAME_DOCKERHUB/prlwr:${{ steps.wildrig.outputs.version }}

      - name: Simpan & commit versi terbaru
        if: steps.wildrig.outputs.skip != 'true'
        run: |
          echo "${{ steps.wildrig.outputs.version }}" > .wildrig_version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .wildrig_version
          git diff --staged --quiet || git commit -m "chore: update WildRig Multi ke ${{ steps.wildrig.outputs.version }}"
          git push
